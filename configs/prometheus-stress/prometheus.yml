global:
  scrape_interval: 3s  # Very frequent scraping for high cardinality stress test
  evaluation_interval: 10s  # More frequent rule evaluation
  external_labels:
    cluster: 'prometheus-local-stress'
    replica: '1'

# Rule files for local evaluation
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Remote write configuration to send data to VictoriaMetrics
remote_write:
  - url: http://victoriametrics-prom-sink:8428/api/v1/write
    queue_config:
      max_samples_per_send: 10000
      batch_send_deadline: 5s
      max_shards: 50
      capacity: 50000

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself for monitoring
  - job_name: 'prometheus'
    scrape_interval: 3s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          source: 'prometheus-stack'

  # Scrape node-exporter
  - job_name: 'node-exporter'
    scrape_interval: 3s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          source: 'prometheus-stack'

  # Scrape pushgateway (high cardinality metrics)
  - job_name: 'pushgateway'
    scrape_interval: 3s
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          source: 'prometheus-stack'
    honor_labels: true

  # Scrape VictoriaMetrics (Prometheus sink) metrics
  - job_name: 'victoriametrics-prom-sink'
    scrape_interval: 10s
    static_configs:
      - targets: ['victoriametrics-prom-sink:8428']
        labels:
          source: 'prometheus-stack'
