groups:
  # ===========================================================================
  # SIMPLE AGGREGATIONS (Baseline)
  # ===========================================================================
  - name: simple_aggregations
    interval: 10s
    rules:
      - record: instance:node_cpu_utilization:ratio
        expr: |
          (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100

      - record: instance:node_memory_utilization:ratio
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100

  # ===========================================================================
  # COMPLEX MULTI-DIMENSIONAL AGGREGATIONS
  # ===========================================================================
  - name: complex_aggregations
    interval: 10s
    rules:
      # High cardinality aggregations
      - record: endpoint:http_requests:rate5m
        expr: |
          sum by (endpoint, method, status, region, version) (rate(http_requests_total[5m]))

      - record: region:http_requests:rate5m
        expr: |
          sum by (region, status) (rate(http_requests_total[5m]))

      - record: endpoint:http_error_ratio:rate5m
        expr: |
          sum by (endpoint, region) (rate(http_requests_total{status=~"5.."}[5m]))
          /
          sum by (endpoint, region) (rate(http_requests_total[5m]))

      - record: version:http_success_ratio:rate5m
        expr: |
          sum by (version, region) (rate(http_requests_total{status=~"2.."}[5m]))
          /
          sum by (version, region) (rate(http_requests_total[5m]))

  # ===========================================================================
  # EXPENSIVE HISTOGRAM QUANTILES
  # ===========================================================================
  - name: histogram_quantiles
    interval: 10s
    rules:
      # Multiple quantiles across high cardinality dimensions
      - record: endpoint:http_request_duration_seconds:p50
        expr: |
          histogram_quantile(0.50,
            sum by (endpoint, method, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

      - record: endpoint:http_request_duration_seconds:p75
        expr: |
          histogram_quantile(0.75,
            sum by (endpoint, method, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

      - record: endpoint:http_request_duration_seconds:p90
        expr: |
          histogram_quantile(0.90,
            sum by (endpoint, method, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

      - record: endpoint:http_request_duration_seconds:p95
        expr: |
          histogram_quantile(0.95,
            sum by (endpoint, method, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

      - record: endpoint:http_request_duration_seconds:p99
        expr: |
          histogram_quantile(0.99,
            sum by (endpoint, method, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

      - record: endpoint:http_request_duration_seconds:p999
        expr: |
          histogram_quantile(0.999,
            sum by (endpoint, method, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

      # GRPC quantiles
      - record: service:grpc_request_duration_seconds:p95
        expr: |
          histogram_quantile(0.95,
            sum by (service, method, le) (rate(grpc_request_duration_seconds_bucket[5m]))
          )

      - record: service:grpc_request_duration_seconds:p99
        expr: |
          histogram_quantile(0.99,
            sum by (service, method, le) (rate(grpc_request_duration_seconds_bucket[5m]))
          )

  # ===========================================================================
  # MULTI-LEVEL RECORDING RULES (Rules depending on other rules)
  # ===========================================================================
  - name: multi_level_rules
    interval: 10s
    rules:
      # Level 1: Base calculations
      - record: region:http_total_requests:rate5m
        expr: |
          sum by (region) (endpoint:http_requests:rate5m)

      - record: region:http_error_requests:rate5m
        expr: |
          sum by (region) (endpoint:http_requests:rate5m{status=~"5.."})

      # Level 2: Calculations based on level 1
      - record: cluster:http_total_requests:rate5m
        expr: |
          sum(region:http_total_requests:rate5m)

      - record: cluster:http_error_ratio:rate5m
        expr: |
          sum(region:http_error_requests:rate5m)
          /
          sum(region:http_total_requests:rate5m)

      # Level 3: Aggregations of level 2
      - record: global:http_requests_per_second:avg
        expr: |
          avg_over_time(cluster:http_total_requests:rate5m[5m])

  # ===========================================================================
  # HEAVY COMPUTATIONAL RULES (Multiple operations and functions)
  # ===========================================================================
  - name: heavy_computations
    interval: 10s
    rules:
      # Complex calculations with multiple operations
      - record: endpoint:http_throughput_mb:rate5m
        expr: |
          (
            sum by (endpoint) (rate(http_requests_total[5m]))
            *
            avg by (endpoint) (http_request_duration_seconds{quantile="0.5"})
            *
            1024
          ) / 1024 / 1024

      # Weighted averages
      - record: region:http_weighted_latency:avg
        expr: |
          sum by (region) (
            rate(http_requests_total[5m])
            *
            endpoint:http_request_duration_seconds:p95
          )
          /
          sum by (region) (rate(http_requests_total[5m]))

      # Standard deviation calculations
      - record: endpoint:http_requests:stddev
        expr: |
          sqrt(
            sum by (endpoint) (rate(http_requests_total[5m]))
            -
            avg by (endpoint) (rate(http_requests_total[5m])) ^ 2
          )

      # Complex ratio with multiple dimensions
      - record: pod:resource_utilization:score
        expr: |
          (
            avg by (pod) (active_connections) / 1000
            +
            avg by (pod) (queue_size) / 500
          ) * 100

  # ===========================================================================
  # HIGH CARDINALITY AGGREGATIONS
  # ===========================================================================
  - name: high_cardinality_rules
    interval: 10s
    rules:
      # Aggregate across many label combinations
      - record: pod:active_connections:sum
        expr: |
          sum by (pod, service, az) (active_connections)

      - record: shard:cache_hit_ratio:avg
        expr: |
          avg by (cache, shard) (cache_hit_ratio)

      - record: partition:kafka_lag:sum
        expr: |
          (
            sum by (topic, partition) (kafka_messages_produced_total)
            -
            sum by (topic, partition) (kafka_messages_consumed_total)
          )

      # Cross-metric joins
      - record: queue:processing_rate_vs_size:ratio
        expr: |
          sum by (queue) (rate(http_requests_total[5m]))
          /
          avg by (queue) (queue_size)

  # ===========================================================================
  # TIME-INTENSIVE LOOKBACK WINDOWS
  # ===========================================================================
  - name: long_lookback_rules
    interval: 10s
    rules:
      - record: endpoint:http_requests:rate30m
        expr: |
          sum by (endpoint, method, status) (rate(http_requests_total[30m]))

      - record: endpoint:http_request_duration:p95_30m
        expr: |
          histogram_quantile(0.95,
            sum by (endpoint, le) (rate(http_request_duration_seconds_bucket[30m]))
          )

      - record: region:http_error_ratio:rate1h
        expr: |
          sum by (region) (rate(http_requests_total{status=~"5.."}[1h]))
          /
          sum by (region) (rate(http_requests_total[1h]))

  # ===========================================================================
  # SUBQUERY-BASED RULES (Most expensive)
  # ===========================================================================
  - name: subquery_rules
    interval: 10s
    rules:
      # Moving averages
      - record: endpoint:http_requests:rate5m_avg10m
        expr: |
          avg_over_time(
            (sum by (endpoint) (rate(http_requests_total[5m])))[10m:1m]
          )

      # Rate of change
      - record: endpoint:http_requests:growth_rate
        expr: |
          deriv(
            (sum by (endpoint) (rate(http_requests_total[5m])))[15m:1m]
          )

      # Peak detection
      - record: endpoint:http_requests:max_rate_10m
        expr: |
          max_over_time(
            (sum by (endpoint) (rate(http_requests_total[1m])))[10m:15s]
          )

  # ===========================================================================
  # DATABASE QUERY PERFORMANCE
  # ===========================================================================
  - name: database_rules
    interval: 10s
    rules:
      - record: table:db_queries:rate5m
        expr: |
          sum by (db, table, operation) (rate(db_queries_total[5m]))

      - record: table:db_query_duration:p99
        expr: |
          max by (db, table) (db_query_duration_seconds{quantile="0.99"})

      - record: table:db_slow_queries:rate5m
        expr: |
          sum by (db, table) (
            rate(db_queries_total[5m])
          )
          and
          db_query_duration_seconds{quantile="0.99"} > 1

  # ===========================================================================
  # RULE EVALUATION SELF-MONITORING
  # ===========================================================================
  - name: rule_evaluation_metrics
    interval: 10s
    rules:
      - record: prometheus:rule_evaluation_duration_seconds:avg
        expr: |
          avg(prometheus_rule_evaluation_duration_seconds)

      - record: prometheus:rule_evaluation_duration_seconds:max
        expr: |
          max(prometheus_rule_evaluation_duration_seconds)

      - record: prometheus:rule_evaluation_failures:rate5m
        expr: |
          rate(prometheus_rule_evaluation_failures_total[5m])

      - record: prometheus:rule_group_duration_seconds:max
        expr: |
          max by (rule_group) (prometheus_rule_group_duration_seconds)

      - record: prometheus:rule_group_duration_seconds:sum
        expr: |
          sum(prometheus_rule_group_duration_seconds)

  # ===========================================================================
  # ADDITIONAL HTTP METRICS (Rules 42-55)
  # ===========================================================================
  - name: http_detailed_metrics
    interval: 10s
    rules:
      - record: method:http_requests:rate5m
        expr: |
          sum by (method) (rate(http_requests_total[5m]))

      - record: method:http_requests:rate1m
        expr: |
          sum by (method) (rate(http_requests_total[1m]))

      - record: status:http_requests:rate5m
        expr: |
          sum by (status) (rate(http_requests_total[5m]))

      - record: endpoint_method:http_requests:rate5m
        expr: |
          sum by (endpoint, method) (rate(http_requests_total[5m]))

      - record: region_version:http_requests:rate5m
        expr: |
          sum by (region, version) (rate(http_requests_total[5m]))

      - record: endpoint:http_4xx_ratio:rate5m
        expr: |
          sum by (endpoint) (rate(http_requests_total{status=~"4.."}[5m]))
          /
          sum by (endpoint) (rate(http_requests_total[5m]))

      - record: region:http_2xx_count:rate5m
        expr: |
          sum by (region) (rate(http_requests_total{status=~"2.."}[5m]))

      - record: region:http_3xx_count:rate5m
        expr: |
          sum by (region) (rate(http_requests_total{status=~"3.."}[5m]))

      - record: region:http_4xx_count:rate5m
        expr: |
          sum by (region) (rate(http_requests_total{status=~"4.."}[5m]))

      - record: region:http_5xx_count:rate5m
        expr: |
          sum by (region) (rate(http_requests_total{status=~"5.."}[5m]))

      - record: version:http_requests_total:rate5m
        expr: |
          sum by (version) (rate(http_requests_total[5m]))

      - record: version:http_error_count:rate5m
        expr: |
          sum by (version) (rate(http_requests_total{status=~"[45].."}[5m]))

      - record: endpoint_region:http_latency:p50
        expr: |
          histogram_quantile(0.50,
            sum by (endpoint, region, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

      - record: endpoint_region:http_latency:p99
        expr: |
          histogram_quantile(0.99,
            sum by (endpoint, region, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

  # ===========================================================================
  # CACHE PERFORMANCE RULES (Rules 56-68)
  # ===========================================================================
  - name: cache_performance
    interval: 10s
    rules:
      - record: cache:hit_rate:5m
        expr: |
          sum by (cache) (rate(cache_hit_ratio[5m]))

      - record: cache:miss_rate:5m
        expr: |
          1 - cache:hit_rate:5m

      - record: cache_shard:hit_rate:5m
        expr: |
          avg by (cache, shard) (cache_hit_ratio)

      - record: cache:hit_rate:1m
        expr: |
          sum by (cache) (rate(cache_hit_ratio[1m]))

      - record: cache:hit_rate:15m
        expr: |
          sum by (cache) (rate(cache_hit_ratio[15m]))

      - record: cache:effective_hit_rate:5m
        expr: |
          (
            sum by (cache) (cache_hit_ratio)
            *
            sum by (cache) (rate(http_requests_total[5m]))
          )
          /
          sum by (cache) (rate(http_requests_total[5m]))

      - record: shard:cache_efficiency:score
        expr: |
          cache_shard:hit_rate:5m * 100

      - record: cache:hit_ratio:p95
        expr: |
          quantile by (cache) (0.95, cache_hit_ratio)

      - record: cache:hit_ratio:p50
        expr: |
          quantile by (cache) (0.50, cache_hit_ratio)

      - record: cache:hit_ratio:stddev
        expr: |
          stddev by (cache) (cache_hit_ratio)

      - record: cache:performance_score
        expr: |
          (cache:hit_rate:5m * 0.7) + (cache:hit_ratio:p95 * 0.3)

      - record: cache_type:hit_rate:comparison
        expr: |
          cache:hit_rate:5m / avg(cache:hit_rate:5m)

      - record: cache:hit_miss_ratio
        expr: |
          cache:hit_rate:5m / cache:miss_rate:5m

  # ===========================================================================
  # QUEUE METRICS (Rules 69-80)
  # ===========================================================================
  - name: queue_metrics
    interval: 10s
    rules:
      - record: queue:size:avg
        expr: |
          avg by (queue) (queue_size)

      - record: queue:size:max
        expr: |
          max by (queue) (queue_size)

      - record: queue:size:min
        expr: |
          min by (queue) (queue_size)

      - record: queue_priority:size:avg
        expr: |
          avg by (queue, priority) (queue_size)

      - record: queue:size:rate_of_change
        expr: |
          deriv((avg by (queue) (queue_size))[5m:])

      - record: queue:size:p95
        expr: |
          quantile by (queue) (0.95, queue_size)

      - record: queue:size:p99
        expr: |
          quantile by (queue) (0.99, queue_size)

      - record: queue:utilization:ratio
        expr: |
          queue:size:avg / 10000

      - record: queue:growth_rate:5m
        expr: |
          (queue:size:avg - avg_over_time(queue:size:avg[5m])) / avg_over_time(queue:size:avg[5m])

      - record: queue:processing_efficiency
        expr: |
          rate(http_requests_total[5m]) / (queue:size:avg + 1)

      - record: queue:backlog_score
        expr: |
          (queue:size:avg / 1000) * (1 / (queue:processing_efficiency + 0.001))

      - record: queue:health_score
        expr: |
          100 - (queue:utilization:ratio * 100)

  # ===========================================================================
  # CONNECTION METRICS (Rules 81-92)
  # ===========================================================================
  - name: connection_metrics
    interval: 10s
    rules:
      - record: service:active_connections:sum
        expr: |
          sum by (service) (active_connections)

      - record: service:active_connections:avg
        expr: |
          avg by (service) (active_connections)

      - record: service:active_connections:max
        expr: |
          max by (service) (active_connections)

      - record: service_az:active_connections:sum
        expr: |
          sum by (service, az) (active_connections)

      - record: service:connection_rate:5m
        expr: |
          rate((sum by (service) (active_connections))[5m:])

      - record: service:connections:p95
        expr: |
          quantile by (service) (0.95, active_connections)

      - record: service:connections:p99
        expr: |
          quantile by (service) (0.99, active_connections)

      - record: pod:connections_per_pod:avg
        expr: |
          avg by (pod) (active_connections)

      - record: service:connection_utilization:ratio
        expr: |
          service:active_connections:sum / 10000

      - record: service:connection_growth:5m
        expr: |
          (service:active_connections:sum - avg_over_time(service:active_connections:sum[5m]))
          / avg_over_time(service:active_connections:sum[5m])

      - record: service:connections_stddev
        expr: |
          stddev by (service) (active_connections)

      - record: service:connection_distribution:coefficient
        expr: |
          service:connections_stddev / service:active_connections:avg

  # ===========================================================================
  # KAFKA METRICS (Rules 93-104)
  # ===========================================================================
  - name: kafka_metrics
    interval: 10s
    rules:
      - record: topic:messages_produced:rate5m
        expr: |
          sum by (topic) (rate(kafka_messages_produced_total[5m]))

      - record: topic:messages_consumed:rate5m
        expr: |
          sum by (topic) (rate(kafka_messages_consumed_total[5m]))

      - record: topic_partition:lag:current
        expr: |
          sum by (topic, partition) (
            kafka_messages_produced_total - kafka_messages_consumed_total
          )

      - record: topic:lag:sum
        expr: |
          sum by (topic) (topic_partition:lag:current)

      - record: topic:lag:max
        expr: |
          max by (topic) (topic_partition:lag:current)

      - record: topic:consumer_lag_ratio
        expr: |
          topic:lag:sum / (topic:messages_produced:rate5m * 300 + 1)

      - record: partition:throughput:rate5m
        expr: |
          sum by (partition) (rate(kafka_messages_produced_total[5m]))

      - record: topic:production_rate:1m
        expr: |
          sum by (topic) (rate(kafka_messages_produced_total[1m]))

      - record: topic:consumption_rate:1m
        expr: |
          sum by (topic) (rate(kafka_messages_consumed_total[1m]))

      - record: topic:lag_growth:5m
        expr: |
          (topic:lag:sum - avg_over_time(topic:lag:sum[5m]))

      - record: topic:partition_count
        expr: |
          count by (topic) (kafka_messages_produced_total)

      - record: topic:avg_partition_lag
        expr: |
          topic:lag:sum / topic:partition_count

  # ===========================================================================
  # GRPC SERVICE METRICS (Rules 105-116)
  # ===========================================================================
  - name: grpc_service_metrics
    interval: 10s
    rules:
      - record: service:grpc_requests:rate5m
        expr: |
          sum by (service) (rate(grpc_requests_total[5m]))

      - record: service_method:grpc_requests:rate5m
        expr: |
          sum by (service, method) (rate(grpc_requests_total[5m]))

      - record: service:grpc_success_rate:5m
        expr: |
          sum by (service) (rate(grpc_requests_total{status="OK"}[5m]))
          /
          sum by (service) (rate(grpc_requests_total[5m]))

      - record: service:grpc_error_rate:5m
        expr: |
          sum by (service) (rate(grpc_requests_total{status!="OK"}[5m]))

      - record: method:grpc_latency:p50
        expr: |
          histogram_quantile(0.50,
            sum by (method, le) (rate(grpc_request_duration_seconds_bucket[5m]))
          )

      - record: method:grpc_latency:p90
        expr: |
          histogram_quantile(0.90,
            sum by (method, le) (rate(grpc_request_duration_seconds_bucket[5m]))
          )

      - record: service_method:grpc_latency:p99
        expr: |
          histogram_quantile(0.99,
            sum by (service, method, le) (rate(grpc_request_duration_seconds_bucket[5m]))
          )

      - record: service:grpc_requests:rate1m
        expr: |
          sum by (service) (rate(grpc_requests_total[1m]))

      - record: service:grpc_throughput:5m
        expr: |
          service:grpc_requests:rate5m *
          histogram_quantile(0.5,
            sum by (service, le) (rate(grpc_request_duration_seconds_bucket[5m]))
          )

      - record: service:grpc_error_ratio
        expr: |
          service:grpc_error_rate:5m / service:grpc_requests:rate5m

      - record: method:grpc_requests:total_rate
        expr: |
          sum(service_method:grpc_requests:rate5m)

      - record: service:grpc_latency_weighted:avg
        expr: |
          sum by (service) (
            service_method:grpc_requests:rate5m * service:grpc_request_duration_seconds:p95
          )
          /
          sum by (service) (service_method:grpc_requests:rate5m)

  # ===========================================================================
  # RESOURCE UTILIZATION (Rules 117-120)
  # ===========================================================================
  - name: resource_utilization
    interval: 10s
    rules:
      - record: pod:cpu_memory_score
        expr: |
          (instance:node_cpu_utilization:ratio / 100 * 0.5) +
          (instance:node_memory_utilization:ratio / 100 * 0.5)

      - record: cluster:resource_pressure:score
        expr: |
          (avg(instance:node_cpu_utilization:ratio) / 100 * 0.4) +
          (avg(instance:node_memory_utilization:ratio) / 100 * 0.4) +
          (avg(queue:size:avg) / 10000 * 0.2)

      - record: service:resource_efficiency:score
        expr: |
          (service:grpc_requests:rate5m / (service:active_connections:sum + 1))
          * (service:grpc_success_rate:5m * 100)

      - record: system:overall_health:score
        expr: |
          (
            (100 - avg(instance:node_cpu_utilization:ratio)) * 0.25 +
            (100 - avg(instance:node_memory_utilization:ratio)) * 0.25 +
            (avg(cache:hit_rate:5m) * 100) * 0.25 +
            (avg(service:grpc_success_rate:5m) * 100) * 0.25
          )
